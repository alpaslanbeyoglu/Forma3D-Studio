    <script>
      (function () {
        var scripts = document.getElementsByTagName('script');
        var isViteDev = false;
        var isBuiltDist = false;
        for (var i = 0; i < scripts.length; i++) {
          var src = scripts[i].getAttribute('src') || '';
          if (src.indexOf('@vite/client') !== -1) isViteDev = true;
          if (src.indexOf('assets/app.js') !== -1 && src.indexOf('dist/assets/app.js') === -1) {
            isBuiltDist = true;
          }
        }
        if (!isViteDev && !isBuiltDist) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './dist/assets/app.css';
          document.head.appendChild(link);

          var script = document.createElement('script');
          script.type = 'module';
          script.src = './dist/assets/app.js';
          document.body.appendChild(script);
        }
      })();
    </script>
