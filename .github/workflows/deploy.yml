name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify production bundle
        run: |
          test -f index.html
          test -f .nojekyll
          test -f bundle/assets/app.js
          test -f bundle/assets/app.css
          echo "Production bundle verified and ready for GitHub Pages."
