name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "forma3d-pages-workflow"
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site distribution
        run: |
          mkdir -p _site/assets _site/bundle/assets
          # If prebuilt bundle exists, populate _site
          if [ -d "bundle" ]; then
            cp -r bundle/. _site/
            cp -r bundle/assets/. _site/assets/ 2>/dev/null || true
            cp -r bundle/assets/. _site/bundle/assets/ 2>/dev/null || true
          fi
          # Also populate from root assets if available
          if [ -d "assets" ]; then
            cp -r assets/. _site/assets/ 2>/dev/null || true
          fi
          cp 404.html _site/404.html 2>/dev/null || true
          touch _site/.nojekyll
          echo "Prepared site files:"
          ls -la _site
          ls -la _site/assets 2>/dev/null || true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true
